<!DOCTYPE html>
<html lang="en" id="dvHtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1877F2" id="dvMetaTheme">
<meta name="description" content="Read the King James Bible free, all 66 books. Works fully offline. Search, highlight and share verses.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="Holy Bible KJV">
<meta property="og:description" content="Read the King James Bible free, all 66 books. Works fully offline.">
<meta name="twitter:card" content="summary">
<link rel="canonical" id="dvCanonical" href="">
<link rel="manifest" id="dvManifestLink" href="manifest.json">
<title>Holy Bible KJV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body id="dvBody">

<!-- ===== HEADER ===== -->
<header class="dv-header" id="dvHeader">
  <button class="dv-icon-btn" id="dvHamburgerBtn" aria-label="Menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <button class="dv-header-search" id="dvHeaderSearch" aria-label="Search">Search</button>
  <button class="dv-icon-btn" id="dvDotsBtn" aria-label="More options">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>

<!-- ===== OVERLAY ===== -->
<div class="dv-overlay" id="dvOverlay"></div>

<!-- ===== LEFT SIDEBAR ===== -->
<aside class="dv-sidebar-left" id="dvLeftSidebar">
  <div class="dv-sidebar-head">
    <button class="dv-icon-btn" id="dvCloseLeft" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span>Holy Bible KJV</span>
  </div>
  <nav class="dv-sidebar-nav" id="dvLeftNav"></nav>
</aside>

<!-- ===== RIGHT SIDEBAR ===== -->
<div class="dv-sidebar-right" id="dvRightSidebar"></div>

<!-- ===== MAIN ===== -->
<main class="dv-container">

  <!-- PAGE: HOME (shown only if the Bible module is removed) -->
  <section class="dv-page dv-page-active" id="dvPageHome">
    <div class="dv-hero">
      <div class="dv-hero-title">Holy Bible KJV</div>
      <div class="dv-hero-sub">King James Version. Read it anytime, even without internet.</div>
    </div>
    <div class="dv-qa-title" id="dvQuickTitle">Quick Actions</div>
    <div class="dv-quick" id="dvQuickActions"></div>
  </section>

</main>

<!-- ===== BOTTOM NAV (each module adds its own buttons) ===== -->
<nav class="dv-bottom-nav" id="dvBottomNav"></nav>

<!-- ===== FULLSCREEN MODAL ===== -->
<div class="dv-modal" id="dvInfoModal">
  <div class="dv-modal-head">
    <button class="dv-icon-btn" id="dvCloseModal" aria-label="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="dv-modal-title" id="dvModalTitle"></div>
  </div>
  <div class="dv-modal-body" id="dvModalBody"></div>
</div>

<!-- ===== TOAST ===== -->
<div class="dv-toast" id="dvToast"></div>

<!-- ===== CORE ===== -->
<script src="app.js"></script>

<!-- ===== MODULES (optional: delete a file or its line and the app keeps working; add a line to onboard a new module) ===== -->
<script src="information.js"></script>
<script src="bible.js"></script>
<script src="more.js"></script>
<script src="notepad.js"></script>
<script src="notification.js"></script>
</body>
</html>
